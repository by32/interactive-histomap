name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master', 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Serve the rendered Thermopylae film, if one has been published
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download thermopylae-film --dir dist/thermopylae/film --repo "$GITHUB_REPOSITORY" || echo "no rendered film published yet"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
